name: Deploy on GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy on GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: export/web
          branch: web-export
